<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>City preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #dde9f2; font: 12px/1.4 ui-monospace, Menlo, monospace; }

    <div id="hud"></div>
